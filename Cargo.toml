[package]
name = "netwatch"
version = "1.5.1"
description = "Network flow monitoring with a browser dashboard, plus the Sniffnet desktop app"
readme = "README.md"
documentation = "https://github.com/0xZenithdev/NetWatch-x/wiki"
keywords = ["filter", "network", "packet", "sniffer", "gui"]
categories = ["visualization", "gui", "network-programming"]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
include = [
    "/src/**/*.rs",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/CHANGELOG.md",
    "/resources/embedded_icons/**/*.svg",
    "/resources/DB/*.mmdb",
    "/resources/fonts/subset/*.ttf",
    "/resources/logos/raw/icon.png",
    "/resources/packaging/windows/graphics/netwatch.ico",
    "/resources/sounds/*.mp3",
    "/services.txt",
    "/build.rs",
]

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[lints]
workspace = true

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[dependencies]

netwatch-packet-parser = { path = "lib/netwatch-packet-parser", version = "0.2.1" }

pcap.workspace = true

async-channel = "2.5.0"
clap = { version = "4.6.6", features = ["derive"] }
confy = "2.0.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
dns-lookup = "4.0.1"
iced = { version = "0.14.0", features = ["tokio", "svg", "advanced", "lazy", "image"] }
ipnet = "2.12.2"
jiff = "0.2.35"
listeners = "0.6.1"
maxminddb = "0.32.0"
nom = "8.0.0"
phf = "0.14.0"
phf_shared = "0.14.0"
picon = "0.1.0"
plotters = { version = "0.3.7", default-features = false, features = ["area_series", "line_series"] }
plotters-iced2 = "0.14.0"
prefix-trie = { version = "0.10.1", features = ["ipnet"] }
reqwest = { version = "0.13.5", features = ["json"] }
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["mp3", "playback"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
splines = "5.0.0"
surge-ping = "0.9.0"
tokio = { version = "1.53.0", features = ["macros", "fs"] }
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
gag = "1.0.0"

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[dev-dependencies]
rstest = "0.27.0"
serde_test = "1.0.177"
serial_test = { version = "4.0.1", default-features = false }

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[build-dependencies]

netwatch-packet-parser = { path = "lib/netwatch-packet-parser", version = "0.2.1", default-features = false }

phf_codegen = "0.14.0"
phf_shared = "0.14.0"
rustrict = { version = "0.7.39", default-features = false, features = ["censor"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[badges]
maintenance = { status = "actively-developed" }

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[package.metadata.deb]
section = "Network"
license-file = "resources/packaging/LICENSE"
extended-description-file = "resources/packaging/linux/description.txt"
maintainer-scripts = "resources/packaging/linux/scripts/"
depends = "libasound2, libpcap0.8, libfontconfig1"
assets = [
    ["target/release/netwatch", "/usr/bin/", "755"],
    ["resources/packaging/linux/netwatch.desktop", "/usr/share/applications/", "644"],
    ["resources/packaging/linux/graphics/netwatch_8x8.png", "/usr/share/icons/hicolor/8x8/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_16x16.png", "/usr/share/icons/hicolor/16x16/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_22x22.png", "/usr/share/icons/hicolor/22x22/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_24x24.png", "/usr/share/icons/hicolor/24x24/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_32x32.png", "/usr/share/icons/hicolor/32x32/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_36x36.png", "/usr/share/icons/hicolor/36x36/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_42x42.png", "/usr/share/icons/hicolor/42x42/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_48x48.png", "/usr/share/icons/hicolor/48x48/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_64x64.png", "/usr/share/icons/hicolor/64x64/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_72x72.png", "/usr/share/icons/hicolor/72x72/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_96x96.png", "/usr/share/icons/hicolor/96x96/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_128x128.png", "/usr/share/icons/hicolor/128x128/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_160x160.png", "/usr/share/icons/hicolor/160x160/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_192x192.png", "/usr/share/icons/hicolor/192x192/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_256x256.png", "/usr/share/icons/hicolor/256x256/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_384x384.png", "/usr/share/icons/hicolor/384x384/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_512x512.png", "/usr/share/icons/hicolor/512x512/apps/netwatch.png", "644"],
    ["resources/packaging/linux/graphics/netwatch_1024x1024.png", "/usr/share/icons/hicolor/1024x1024/apps/netwatch.png", "644"]
]

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[package.metadata.generate-rpm]
post_install_script = "setcap cap_net_raw,cap_net_admin=eip /usr/bin/netwatch"
assets = [
    { source = "target/release/netwatch", dest = "/usr/bin/", mode = "755" },
    { source = "resources/packaging/linux/netwatch.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_8x8.png", dest = "/usr/share/icons/hicolor/8x8/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_22x22.png", dest = "/usr/share/icons/hicolor/22x22/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_24x24.png", dest = "/usr/share/icons/hicolor/24x24/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_36x36.png", dest = "/usr/share/icons/hicolor/36x36/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_42x42.png", dest = "/usr/share/icons/hicolor/42x42/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_72x72.png", dest = "/usr/share/icons/hicolor/72x72/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_96x96.png", dest = "/usr/share/icons/hicolor/96x96/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_160x160.png", dest = "/usr/share/icons/hicolor/160x160/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_192x192.png", dest = "/usr/share/icons/hicolor/192x192/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_384x384.png", dest = "/usr/share/icons/hicolor/384x384/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/netwatch.png", mode = "644" },
    { source = "resources/packaging/linux/graphics/netwatch_1024x1024.png", dest = "/usr/share/icons/hicolor/1024x1024/apps/netwatch.png", mode = "644" }
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
libpcap = "*"
fontconfig = "*"

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[package.metadata.wix]
include = [".\\resources\\packaging\\windows\\setup.wxs"]

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

[workspace]
members = [".", "lib/netwatch-packet-parser", "netwatchd"]
default-members = [".", "lib/netwatch-packet-parser", "netwatchd"]

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[workspace.package]
authors = ["Giuliano Bellini <gyulyvgc99@gmail.com>"]
edition = "2024"
homepage = "https://github.com/0xZenithdev/NetWatch-x"
repository = "https://github.com/0xZenithdev/NetWatch-x"
license = "MIT OR Apache-2.0"

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[workspace.dependencies]
etherparse = "0.21.0"
pcap = "2.5.0"

#───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
